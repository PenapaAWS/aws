<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8202A">
<title>IKM Activities Work Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: field-log app. Sticky top bar, list of sheets → editor with stacked form sections → paper-replica form view.
   Rows become labelled cards under 720px so the same sheet works on a phone in the field and on a desk computer. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#15181C; --muted:#5B636E; --line:#D9DDE3;
  --accent:#C8202A; --accent-ink:#FFFFFF; --accent-soft:#FBE9EA;
  --ok:#1D7348; --ok-soft:#E3F2EA; --warn:#94590A; --warn-soft:#FBF0DE;
  --pad-ink:#1B2A6B; --pad-bg:#FFFFFF; --info:#1D63C9; --info-soft:#E4EEFC; --bad:#B42318; --bad-soft:#FDECEA;
  --f-ui:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1D21; --sunk:#22262B; --ink:#E8EAED; --muted:#9AA2AD; --line:#2E333A;
  --accent:#E8434B; --accent-ink:#FFFFFF; --accent-soft:#3A1D20;
  --ok:#5BC98F; --ok-soft:#173226; --warn:#E3A84E; --warn-soft:#352915; --info:#6EA8FF; --info-soft:#17263D; --bad:#FF7A6E; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D21; --sunk:#22262B; --ink:#E8EAED; --muted:#9AA2AD; --line:#2E333A;
  --accent:#E8434B; --accent-ink:#FFFFFF; --accent-soft:#3A1D20;
  --ok:#5BC98F; --ok-soft:#173226; --warn:#E3A84E; --warn-soft:#352915; --info:#6EA8FF; --info-soft:#17263D; --bad:#FF7A6E; --bad-soft:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:7px;background:#FFFFFF;display:grid;place-items:center;border:1px solid var(--line)}
.logo img{width:34px;height:auto;display:block}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .nm{font-size:13px;font-weight:600;max-width:16ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 7px;background:var(--sunk);color:var(--muted);flex:none}
.role.admin{background:var(--accent-soft);color:var(--accent)}
/* gate + users */
.gate{max-width:520px;margin:6vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;text-align:center}
.gate img{width:72px;margin:0 auto 14px;display:block}
.gate h1{font-size:20px;margin:0 0 8px}
.gate p{color:var(--muted);margin:0 0 16px}
.gate .id{background:var(--sunk);border-radius:8px;padding:10px;margin-bottom:16px;font-size:14px}
.ulist{display:flex;flex-direction:column}
.urow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .u{flex:1 1 200px;min-width:0}
.urow .u b{display:block;font-size:14px;overflow-wrap:anywhere}
.urow .u small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.rule-list{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
@media (max-width:720px){ .who .nm{display:none} }
.mark-t{min-width:0}
.mark-t b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark-t small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:18px 96px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--accent)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{border-color:var(--line);color:var(--accent)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* banners */
.note{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);margin-bottom:14px}

/* list view */
.list-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.list-head h1{font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.list-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;min-height:42px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:12px}
.stats b{color:var(--ink);font-family:var(--f-num);font-weight:600;margin-right:4px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sheet{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;width:100%}
.sheet:hover{border-color:var(--muted)}
.cal{grid-row:span 3;width:52px;border:1px solid var(--line);border-radius:8px;text-align:center;overflow:hidden;align-self:start}
.cal i{display:block;font-style:normal;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:2px 0}
.cal b{display:block;font-family:var(--f-num);font-size:20px;line-height:1.5}
.cal small{display:block;font-size:10.5px;color:var(--muted);padding-bottom:3px}
.sheet .job{font-family:var(--f-num);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .ttl{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.sheet .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mode-strip{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin:6px -14px -14px;padding:7px 14px;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);font-size:12.5px;color:var(--muted)}
.mode-strip b{font-weight:700}
.mode-strip.m-manual{background:#EFF4FF}.mode-strip.m-manual b{color:#1D4ED8}
.mode-strip.m-paper{background:#FFF4E5}.mode-strip.m-paper b{color:#B45309}
.ex-opts{display:grid;gap:10px;margin:6px 0 14px}.ex-opt{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink)}.ex-opt:hover,.ex-opt:focus-visible{border-color:#D32F2F;box-shadow:0 0 0 3px rgba(211,47,47,.12)}.ex-opt b{font-size:15px}.ex-tb{margin:2px 4px 0;font-size:13.5px}.ex-opt span{font-size:13px;color:var(--muted)}
.btn.bpdf{background:#D32F2F;border-color:#D32F2F;color:#fff}.btn.bpdf:hover{filter:brightness(1.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-ui);font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.signed{background:var(--ok-soft);color:var(--ok)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
.empty p{max-width:46ch;margin:0 auto 16px}

/* editor */
.ed-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ed-top .desk{display:flex;gap:8px;flex-wrap:wrap}
.ed-top h1{font-size:20px;margin:0;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status.err{color:var(--accent)}
.older{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;margin:16px 0 8px;font-size:13px}
.req{color:var(--accent);margin-left:3px}
.field.bad .inp{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.status.unsaved{color:#B58900;font-weight:600}
.status.unsaved::before{background:#B58900}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.busy::before{background:var(--warn)}
.status.err::before{background:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:9px;margin-bottom:14px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.jump a{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.jump a:hover{color:var(--accent);border-color:var(--accent)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;scroll-margin-top:80px}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:15px;margin:0;display:flex;align-items:baseline;gap:8px}
.sec-h h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.sec-h .sum{margin-left:auto;font-size:12.5px;color:var(--muted)}
.sec-h .sum b{font-family:var(--f-num);color:var(--ink)}
.sec-b{padding:14px 16px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.inp{width:100%;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 10px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;min-height:40px;line-height:1.45}
.inp[readonly]{background:var(--sunk)}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

/* rows */
.rows{display:flex;flex-direction:column}
.r{display:grid;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r.hd{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding-top:0}
.r .no{font-family:var(--f-num);color:var(--muted);font-size:13px;text-align:center}
.r .cl{display:none}
.mp{grid-template-columns:34px minmax(0,2fr) minmax(0,1.4fr) 118px 118px 36px}
.eq{grid-template-columns:34px minmax(0,3fr) 110px 36px}
.wk{grid-template-columns:34px 170px minmax(0,1fr) 36px}
.hrs{font-family:var(--f-num);font-size:13.5px;text-align:right}
.add{margin-top:10px}

/* signatures */
.sigs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sig{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sig h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.sig h3 .pill{margin-left:auto}
.pad{position:relative;border:1px dashed var(--line);border-radius:7px;background:var(--pad-bg);height:120px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:7px;cursor:crosshair}
.pad .hint{position:absolute;inset:auto 0 8px 0;text-align:center;font-size:12px;color:#8a919b;pointer-events:none}
.pad .base{position:absolute;left:14px;right:14px;bottom:28px;border-top:1px solid #c9cdd3;pointer-events:none}
.sig-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* paper form view (always paper-white: it represents the printed form) */
.paper-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:#e7e9ec}
.paper{background:#fff;color:#111;width:1100px;margin:16px auto;padding:22px 26px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.view-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

/* overlay + toast */
.ov{position:fixed;inset:0;background:rgba(10,12,15,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border-radius:12px;padding:20px;max-width:400px;width:100%;border:1px solid var(--line)}
.dlg h2{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}

/* mobile action bar */
.mbar{display:none}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.abar-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.abar-in .hint2{flex-basis:100%;text-align:center;font-size:12px;color:var(--muted);margin-bottom:-2px}
.abar .btn{min-width:140px;min-height:44px}
.pill.pend{background:var(--info-soft);color:var(--info)}
.pill.ret{background:var(--warn-soft);color:var(--warn)}
.pill.appr{background:var(--ok);color:var(--surface)}
.pill.appr::before{background:var(--surface)}
.pill.rej{background:var(--bad-soft);color:var(--bad)}
.btn.info{background:var(--info);border-color:var(--info);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.warnb{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.rejb{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.info:hover,.btn.okb:hover{filter:brightness(1.08)}
.qtabs{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.qtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.qtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qtabs .badge{font-family:var(--f-num);font-size:12px;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.qtabs .hot .badge{background:var(--info);color:#fff}
.sheet.needs{border-color:var(--info);box-shadow:inset 3px 0 0 var(--info)}
.dsel input{border:0;background:none;outline:none;font-family:var(--f-num);padding:8px 0;min-width:0}
.whosel{flex:0 1 220px}
.roles-chips{display:inline-flex;gap:4px;flex-wrap:wrap}
.role.approver{background:var(--info-soft);color:var(--info)}
.role.viewer{background:var(--ok-soft);color:var(--ok)}
.role.manager{background:#EDE7FB;color:#5B3CC4}
.route{list-style:none;margin:0 0 12px;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.stepc{border:1px solid var(--line);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;min-width:120px}
.stepc small{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stepc b{font-size:14px}
.stepc.done{border-color:var(--ok);background:var(--ok-soft)}
.stepc.cur{border-color:var(--info);background:var(--info-soft)}
.stepc.rej{border-color:var(--bad);background:var(--bad-soft)}
.ap-box{border:1px solid var(--info);border-radius:9px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ap-btns{display:flex;gap:8px;flex-wrap:wrap}
.ap-btns .btn{flex:1 1 140px;min-height:44px}
.h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 8px}
.hist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13.5px}
.hist li p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.hist .h-approve{border-color:var(--ok)} .hist .h-reject{border-color:var(--bad)} .hist .h-return{border-color:var(--warn)} .hist .h-submit{border-color:var(--info)}
.note.ret{background:var(--warn-soft);color:var(--ink)}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;margin-bottom:12px}
.att{display:grid;grid-template-columns:64px 1fr;grid-template-rows:auto auto;gap:6px 10px;border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}
button.att-thumb{border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
[data-gdthumb]{display:contents}
.att-thumb{grid-row:span 2;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;text-decoration:none}
.att-thumb img{width:100%;height:100%;object-fit:cover}
.att-ico{font-family:var(--f-num);font-weight:600;font-size:12px;color:var(--bad)}
.att-meta{min-width:0}.att-meta b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-acts{display:flex;gap:6px;flex-wrap:wrap}
.att-acts .btn{text-decoration:none}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.field .chk,.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.loc .sec-h .loc-name{max-width:320px;font-weight:600}

const canAct = w => !!w && (isCurrentApprover(w) || (isAdmin() && FLOW_ST.includes(w.status)));
const nameOf = id => { const u=S.users[id]; return u ? (u.full_name||u.username) : "—"; };
const locName = id => { const l=S.locs.find(x=>x.id===id); return l ? l.name : ""; };
const userLocs = id => { const u=S.users[id]; return (u && u.location_ids) || []; };
// Locations a sheet can be filed under: the owner's locations (an admin owner may use any)
function sheetLocOptions(w){
  const owner=S.users[w.createdBy];
  if(owner && (owner.roles||[]).includes("admin")) return S.locs;
  const ids=userLocs(w.createdBy); return S.locs.filter(l=>ids.includes(l.id));
}
// Same rule as the server: Job No. location, then Project, then Client (admin lists), else the owner's first location.
// Once submitted, the location the server stored is the one shown.
function sheetLoc(w){
  if(!OPEN_ST.includes(w.status||"draft") && w.locationId) return w.locationId;
  const norm=s=>(s||"").trim().toLowerCase();
  for(const [kind,k] of [["job","jobNo"],["project","project"],["client","client"]]){
    const m=(S.masters[kind]||[]).find(x=>x.location_id && norm(x.value)===norm(w[k]) && norm(w[k]));
    if(m) return m.location_id;
  }
  return userLocs(w.createdBy)[0] || null;
}
function routeFor(w){
  const loc=S.locs.find(l=>l.id===sheetLoc(w));
  return ((loc && loc.approvers)||[]).filter(id=> id && id!==w.createdBy && S.users[id] && S.users[id].active && (S.users[id].roles||[]).includes("approver"));
}

function rowToSheet(r){
  return normalize(Object.assign({}, r.data||{}, { id:r.id, date:r.work_date||"", jobNo:r.job_no, client:r.client, project:r.project,
    status:r.status||"draft", chain:r.approval_chain||[], step:r.current_step||0, locationId:r.location_id,
    submittedAt:r.submitted_at, decidedAt:r.decided_at,
    createdBy:r.created_by, updatedBy:r.updated_by, updatedAt: Date.parse(r.updated_at)||0 }));
}
function sheetToRow(w){
  return { work_date: w.date || null, job_no: w.jobNo||"", client: w.client||"", project: w.project||"", status: w.status||"draft", location_id: w.locationId||null,
    data: { mode:w.mode||"manual", manpower:w.manpower, equipment:w.equipment, work:w.work, sign:w.sign } };
}
async function adminCall(body, anon){
  let token = SUPABASE_KEY;
  if(!anon){ const { data } = await sb.auth.getSession(); token = data.session ? data.session.access_token : SUPABASE_KEY; }
  let res;
  try{ res = await fetch(`${SUPABASE_URL}/functions/v1/aws-admin`, { method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:"Bearer "+token }, body:JSON.stringify(body) }); }
  catch(e){ throw { message:t("netErr") }; }
  let j={}; try{ j=await res.json(); }catch(e){}
  if(!res.ok) throw { code:j.code, message: srvMsg(j.code, j.error) };
  return j;
}

async function loadMasters(){

/* The list never downloads signatures (≈27 KB each, 98% of a row). Full rows are fetched only when a sheet is opened.
   After the first load, sync downloads only rows changed since the last check — this keeps Supabase egress low. */
const LIST_COLS = "id, work_date, job_no, client, project, status, approval_chain, current_step, location_id, submitted_at, decided_at, created_by, updated_by, updated_at, mode:data->>mode, manpower:data->manpower, equipment:data->equipment, work:data->work";
const lightRow = r => Object.assign({}, r, { data:{ mode:r.mode||"manual", manpower:r.manpower||[], equipment:r.equipment||[], work:r.work||[] } });
let sheetsAt = "", delAt = "", sheetsChanged = false;
const LIST_DAYS = 30;            // the list first loads work sheets of the last 30 days (plus any still open); older ones on request
let listAll = false;
const listCut = () => { const d=new Date(Date.now()-LIST_DAYS*864e5); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
async function loadOlder(){ if(listAll) return; listAll=true; busy(true); try{ await loadSheets(true); }catch(e){ toast(t("netErr")); } busy(false); renderList(); }
async function loadSheets(full){
  if(full || !sheetsAt){
    let q = sb.from("aws_worksheets").select(LIST_COLS);
    if(!listAll) q = q.or(`work_date.gte.${listCut()},work_date.is.null,status.in.(draft,saved,submitted,pending,returned)`);
    const { data, error } = await q.order("work_date",{ascending:false, nullsFirst:false}).order("updated_at",{ascending:false}).limit(5000);
    if(error) throw error;
    S.list = data.map(r=>Object.assign(rowToSheet(lightRow(r)),{ _light:true }));
    sheetsAt = data.reduce((m,r)=> r.updated_at>m ? r.updated_at : m, "");
    delAt = new Date(Date.now()-10*60e3).toISOString();   // small overlap for clock differences
    sheetsChanged = true;
    return;
  }
  // only rows changed since the last check, plus ids of sheets deleted since then (aws_deleted log)
  const [chg, del] = await Promise.all([
    sb.from("aws_worksheets").select(LIST_COLS).gt("updated_at", sheetsAt).limit(1000),
    sb.from("aws_deleted").select("id, deleted_at").gte("deleted_at", delAt).limit(1000)]);
  if(chg.error) throw chg.error;
  sheetsChanged = chg.data.length>0;
  chg.data.forEach(r=>{ const w=Object.assign(rowToSheet(lightRow(r)),{ _light:true }); const i=S.list.findIndex(x=>x.id===w.id);
    if(i<0) S.list.unshift(w); else if(w.updatedAt>=S.list[i].updatedAt) S.list[i]=w;
    if(r.updated_at>sheetsAt) sheetsAt=r.updated_at; });
  if(!del.error && del.data.length){ const gone=new Set(del.data.map(x=>x.id)); const n=S.list.length; S.list=S.list.filter(w=>!gone.has(w.id)); if(S.list.length!==n) sheetsChanged=true;
    del.data.forEach(x=>{ if(x.deleted_at>delAt) delAt=x.deleted_at; }); }
  S.list.sort((a,b)=>(b.date||"").localeCompare(a.date||"") || b.updatedAt-a.updatedAt);
}
async function fetchFull(id){
  const { data, error } = await sb.from("aws_worksheets").select("*").eq("id", id).maybeSingle();
  if(error || !data) return null;
  const w=rowToSheet(data); const i=S.list.findIndex(x=>x.id===id); if(i>=0) S.list[i]=w; else S.list.push(w); return w;
}
async function loadLog(id){
  const { data, error } = await sb.from("aws_approval_log").select("actor, action, step, comment, created_at").eq("sheet_id", id).order("created_at");
  if(!error) S.logs[id]=data;
}
let fullAt=0;
async function refreshAll(force){
  // users / locations / lists change rarely: reload them every 10 minutes or when asked
  // the full sheet list downloads only at sign-in or on the refresh button; every other check is incremental
  const lists = force || Date.now()-fullAt > 600e3;
  try{ await Promise.all([...(lists ? [loadUsers(), loadLocs(), loadMasters()] : []), loadSheets(!!force)]); if(lists) fullAt=Date.now(); }catch(e){ toast(t("netErr")); }
}

const view = { name:"list", id:null, tab:"edit", q:"", who:"all", st:"all", from:"", to:"", queue:false, utab:"users", fjob:"", fclient:"", fproject:"", page:"sheets", ty:null, tm:null, tjob:"", td1:0, td2:0 };
let RO=true, cur=null, isNew=false, dirty=false, inflight=false, pending=false, saveTimer=null, saveState="saved", saveErr="";

async function openSheet(id){
  const [w] = await Promise.all([fetchFull(id), loadLog(id), loadAtts(id)]); if(!w){ toast(t("noSheetAccess")); return; }
  Object.keys(comboOpen).forEach(k=>delete comboOpen[k]); Object.keys(empOpen).forEach(k=>delete empOpen[k]);
  cur=normalize(w); cur.id=id; isNew=false; dirty=false; saveState="saved";
  view.name="edit"; view.id=id; view.tab="edit"; render(); window.scrollTo(0,0);
}
async function createSheet(fromId){
  let d;
  if(fromId){ const src=(cur && cur.id===fromId) ? cur : S.list.find(x=>x.id===fromId); d=normalize(src);
    d.date=today(); d.sign=blank().sign; d.work=[{time:"",activity:""}];
  } else d=blank();
  d.id=uuid(); d.createdBy=S.me; d.updatedBy=S.me; d.updatedAt=0; d.status="draft"; d.chain=[]; d.step=0; { const ids=userLocs(S.me); d.locationId = fromId ? (d.locationId||null) : (ids.length===1?ids[0]:null); }
  Object.keys(comboOpen).forEach(k=>delete comboOpen[k]); Object.keys(empOpen).forEach(k=>delete empOpen[k]);
  cur=d; isNew=true; S.logs[d.id]=[]; S.atts[d.id]=[]; view.name="edit"; view.id=d.id; view.tab="edit"; dirty=!!fromId; saveState="saved"; render(); window.scrollTo(0,0);
  if(fromId){ paintStatus(); toast(t("duplicated")); }
}
function scheduleSave(){
  if(RO) return;
  dirty=true; saveState="dirty"; paintStatus();   // manual save only: nothing is stored until a save button is pressed
}
async function flush(){
  clearTimeout(saveTimer);
  if(!cur || !dirty) return;
  if(inflight){ pending=true; return; }
  inflight=true; dirty=false; saveState="busy"; paintStatus();
  const w=clone(cur); const row=sheetToRow(w);
  try{
    let res;
    if(isNew){ res = await sb.from("aws_worksheets").insert(Object.assign({ id:w.id, created_by:S.me }, row)).select(LIST_COLS).single(); }
    else { res = await sb.from("aws_worksheets").update(row).eq("id", w.id).select(LIST_COLS).single(); }   // no signatures in the reply
    if(!res.error && res.data) res.data = lightRow(res.data);
    if(res.error) throw res.error;
    isNew=false;
    const saved=rowToSheet(res.data);
    if(cur && cur.id===saved.id) cur.updatedAt=saved.updatedAt;
    const i=S.list.findIndex(x=>x.id===saved.id); if(i>=0) S.list[i]=saved; else S.list.unshift(saved);
    saveState="saved"; saveErr="";
  }catch(e){ saveState="err"; saveErr=(e&&e.message)||""; dirty=true; }
  inflight=false; paintStatus();
  if(pending){ pending=false; flush(); }
}
function backToList(msg){ if(msg) toast(msg); view.name="list"; cur=null; RO=true; render(); window.scrollTo(0,0); }
["input","change"].forEach(ev=>document.addEventListener(ev,e=>{ const f=e.target.closest && e.target.closest(".field.bad"); if(f) f.classList.remove("bad"); }));
function checkInfo(){
  const miss=missingInfo(cur); if(!miss.length) return true;
  const lbl={ date:t("date"), client:t("client"), jobNo:t("jobNo"), project:t("project") };
  toast(t("needInfo")+": "+miss.map(k=>lbl[k]).join(", "));
  document.querySelectorAll("#sec-info .field").forEach(f=>f.classList.remove("bad"));
  miss.forEach(k=>{ const el=$("#f-"+k+"-sel")||$("#f-"+k); if(el) el.closest(".field").classList.add("bad"); });
  const s=$("#sec-info"); if(s) s.scrollIntoView({block:"start"});
  return false;
}
async function commit(st){
  if(RO || !cur) return;
  if(st==="saved" && !checkInfo()) return;
  if(st) cur.status=st; dirty=true; await flush();
  if(saveState==="err"){ toast(t("notSaved")+(saveErr?" — "+saveErr:"")); return; }
  if(!st){ toast(t("keptDone")); const y=window.scrollY; renderEdit(); window.scrollTo(0,y); return; }  // Save changes keeps status and stays
  if(st==="draft"){ toast(t("draftDone")); const y=window.scrollY; renderEdit(); window.scrollTo(0,y); return; }  // Save Draft keeps the sheet open
  backToList(t("savedDone"));
}
async function rpcAct(id, action, comment){
  const { data, error } = await sb.rpc("aws_act", { p_id:id, p_action:action, p_comment:comment||"" });
  if(error) throw { message: srvMsg(null, error.message) };
  return data;
}
function submitSheet(){
  if(!canSubmit(cur)) return;
  if(!checkInfo()) return;
  if(cur.mode==="paper"){
    const need = !(attsOf("paper").length || attsOf("paper_draft").length) ? ["needPaper","#sec-mode"]
      : !hasSig(cur.sign.ikm) ? ["needSigs","#sec-sg"] : null;
    if(need){ toast(t(need[0])); const s=$(need[1]); if(s) s.scrollIntoView({block:"start"}); return; }
  }
  else if(!hasSig(cur.sign.ikm)){ toast(t("needSigs")); const s=$("#sec-sg"); if(s) s.scrollIntoView({block:"start"}); return; }
  const go=()=>{
  const route=routeFor(cur);
  const body = route.length ? t("submitP")+" "+route.map((id,i)=>`${i+1}. ${nameOf(id)}`).join("  →  ") : t("submitNoRoute");
  confirmBox(t("submitT"), body, t("btnSubmit"), async()=>{
    dirty=true; await flush();
    if(saveState==="err"){ toast(t("notSaved")+(saveErr?" — "+saveErr:"")); return; }
    try{ await rpcAct(cur.id,"submit",""); await refreshAll(); backToList(t("submittedDone")); }
    catch(e){ toast(e.message); }
  }, "info");
  };
  // Toolbox talk is optional, but warn before sending without it
  if(!attsOf("toolbox").length) confirmBox(t("noTbT"), t("noTbP"), t("sendAnyway"), ()=>setTimeout(go,0), "info"); else go();
}
async function act(action){
  if(!cur) return;
  const box=$("#ap-c"); const comment=box?box.value.trim():"";
  if((action==="reject"||action==="return") && !comment){ toast(t("needComment")); if(box) box.focus(); return; }
  const run = async()=>{
    if(dirty){ await flush(); if(saveState==="err"){ toast(t("notSaved")); return; } }
    try{
      await rpcAct(cur.id, action, comment); await refreshAll();
      if(action==="reopen"){ await openSheet(cur.id); toast(t("reopenedDone")); return; }
      backToList(t("done_"+action));
    }catch(e){ toast(e.message); }
  };
  if(action==="reject") confirmBox(t("rejectT"), t("rejectP"), t("reject"), run);
  else if(action==="reopen") confirmBox(t("reopenT"), t("reopenP"), t("reopen"), run, "plain");
  else run();
}
function paintStatus(){
  document.querySelectorAll(".status").forEach(el=>{
    const un = saveState!=="busy" && saveState!=="err" && (dirty || isNew);
    el.className="status"+(saveState==="busy"?" busy":saveState==="err"?" err":un?" unsaved":"");
    el.textContent = saveState==="busy"?t("saving"):saveState==="err"?t("notSaved")+(saveErr?" — "+saveErr:""):un?t("unsaved"):t("saved");
  });
}
/* pick up changes made on another device */
async function sync(){
  if(S.phase!=="app" || document.visibilityState!=="visible") return;
  if(view.name==="edit" && (dirty||inflight)) return;
  await refreshAll();
  if(view.name==="edit" && cur && !dirty && !inflight){
    const lw=S.list.find(x=>x.id===cur.id);
    if(lw && lw.updatedAt>(cur.updatedAt||0)){
      const a=document.activeElement; if(a && $("#app").contains(a) && /INPUT|TEXTAREA/.test(a.tagName)) return;
      const [w] = await Promise.all([fetchFull(lw.id), loadLog(lw.id)]); if(!w) return;
      const tab=view.tab; cur=normalize(w); view.tab=tab; render();
    }
    return;
  }
  if(view.name==="list" && view.page==="track"){ if($("#ov-slot").innerHTML || !sheetsChanged) return; if(view.tm) await loadActual(view.tm); renderTrack(); return; }
  if(view.name!=="edit"){ const a=document.activeElement; if(a && /INPUT|SELECT/.test(a.tagName) && $("#app").contains(a)) return; render(); }
}
setInterval(sync, 60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") sync(); });

function renderLogin(msg){
  $("#mbar-slot").innerHTML="";
  $("#app").innerHTML=`<div class="auth"><img src="${LOGO()}" alt="IKM"><h1>${esc(t("loginT"))}</h1><p>${esc(t("loginP"))}</p>
    <form id="login" novalidate>
      <div class="field"><label for="l-u">${esc(t("username"))}</label><input class="inp" id="l-u" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="l-p">${esc(t("password"))}</label><input class="inp" id="l-p" type="password" autocomplete="current-password" required></div>
      <div class="err" id="l-err" role="alert">${esc(msg||"")}</div>
      <button class="btn pri" id="l-go" type="submit">${esc(t("signIn"))}</button>
    </form></div>`;
  $("#l-u").focus();
  $("#login").onsubmit=async e=>{
    e.preventDefault();
    const u=$("#l-u").value.trim(), p=$("#l-p").value, err=$("#l-err"), go=$("#l-go");
    if(!u||!p){ err.textContent=t("badLogin"); return; }
    go.disabled=true; go.textContent=t("signingIn"); err.textContent="";
    try{
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: p });
      if(error){ err.textContent = /fetch|network/i.test(error.message) ? t("netErr") : (/banned/i.test(error.message)? t("noAccess") : t("badLogin")); return; }
      const ok = await loadProfile();
      if(!ok){ await sb.auth.signOut(); err.textContent=t("noAccess"); return; }
      await refreshAll(true); S.phase="app"; view.name="list"; view.queue = S.list.some(canAct); render();
    }catch(ex){ err.textContent=t("netErr"); }
    finally{ if(go.isConnected){ go.disabled=false; go.textContent=t("signIn"); } }
  };
}
function renderSetup(){
  $("#mbar-slot").innerHTML="";

const blobToDataURL = b => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(b); });
const imgSize = src => new Promise(res=>{ const im=new Image(); im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight}); im.onerror=()=>res(null); im.src=src; });
// a JPEG data URL for an attachment image, from Google Drive or the older Supabase Storage files
async function attImageData(a){
  let blob;
  if(isGd(a)){ const f=await gd("get",{ id:a.id }); blob=b64Blob(f.b64, f.mime||a.mime); }
  else { const { data, error } = await sb.storage.from(ATT_BUCKET).download(a.path); if(error) throw error; blob=data; }
  const url=await blobToDataURL(blob); const sz=await imgSize(url); if(!sz) return null;
  const k=Math.min(1, 2000/Math.max(sz.w,sz.h)); const c=document.createElement("canvas"); c.width=Math.round(sz.w*k); c.height=Math.round(sz.h*k);
  const im=new Image(); im.src=url; await new Promise(r=>{ if(im.complete) r(); else im.onload=r; });
  c.getContext("2d").drawImage(im,0,0,c.width,c.height); return { url:c.toDataURL("image/jpeg",0.85), w:c.width, h:c.height };
}
// Export every work sheet in the list as its full form (one page each, with signatures); Paper sheets add their scanned pages
async function fullPdf(withTb){
  const rows=LIST_ROWS.rows||[]; if(!rows.length){ toast(t("noMatch")); return; }
  busy(true, t("exPreparing"));
  let h2c, jsPDF;
  try{
    h2c = await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","html2canvas");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","jspdf");
    jsPDF = window.jspdf.jsPDF;
  }catch(e){ busy(false); toast(t("dlFail")); return; }
  const shell=document.createElement("div");
  shell.style.cssText="position:fixed;left:0;top:0;width:1200px;height:2400px;overflow:hidden;pointer-events:none;z-index:-1";
  document.body.appendChild(shell);
  const pdf = new jsPDF({orientation:"landscape",unit:"mm",format:"a4"}); const W=297,H=210,m=7;
  let first=true, skipped=0;
  const addPage=()=>{ if(!first) pdf.addPage(); first=false; };
  try{
    try{ await document.fonts.ready; }catch(e){}
    const ids=rows.map(w=>w.id);
    for(let i=0;i<ids.length;i+=10){
      const part=ids.slice(i,i+10);
      const [full, att] = await Promise.all([
        sb.from("aws_worksheets").select("*").in("id", part),
        sb.from("aws_attachments").select("id, sheet_id, kind, path, name, mime, created_at").in("sheet_id", part).in("kind", withTb?["paper","paper_draft","toolbox"]:["paper","paper_draft"]).order("created_at")]);
      if(full.error) throw full.error;
      const byId={}; full.data.forEach(r=>byId[r.id]=rowToSheet(r));
      for(const id of part){
        const w=byId[id]; if(!w){ skipped++; continue; }
        busy(true, t("exMaking").replace("{n}", ids.indexOf(id)+1).replace("{t}", ids.length));
        const mine=(att.data||[]).filter(a=>a.sheet_id===id);
        const notImg = a => !/^image\//.test(a.mime) || /hei[cf]/.test(a.mime);
        const papers=mine.filter(a=>a.kind!=="toolbox"), tbs=mine.filter(a=>a.kind==="toolbox");
        const pdfFiles=papers.filter(notImg), tbPdf=tbs.filter(notImg);
        const note = (w.mode==="paper" ? `<div style="margin-top:6px;font-size:12px;color:#7A3E00"><b>Paper</b> — ${esc(t("exPaperNote"))}${pdfFiles.length?" · "+esc(t("exPdfAtt"))+": "+pdfFiles.map(a=>esc(a.name)).join(", "):""}</div>` : "")
          + (withTb ? `<div style="margin-top:4px;font-size:12px;color:#1F6B3A"><b>Toolbox talk</b> — ${tbs.length ? esc(t("exTbNote").replace("{n}", tbs.length-tbPdf.length)) + (tbPdf.length?" · "+esc(t("exPdfAtt"))+": "+tbPdf.map(a=>esc(a.name)).join(", "):"") : esc(t("exNoTb"))}</div>` : "");
        shell.innerHTML=`<div class="pdfsrc" style="position:absolute;left:0;top:0;width:1123px;background:#fff;padding:18px 22px;color:#111"><style>${PF_CSS(".pdfsrc ")}</style>${formHTML(w)}${note}</div>`;
        const host=shell.firstChild;
        await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
        const canvas = await h2c(host,{scale:isMobile()?1.4:1.8,backgroundColor:"#ffffff",logging:false,scrollX:0,scrollY:0,windowWidth:1200,windowHeight:Math.max(1200,host.scrollHeight+40),width:host.offsetWidth,height:host.offsetHeight});
        const ratio=canvas.width/canvas.height; let cw=W-2*m, ch=cw/ratio; if(ch>H-2*m){ ch=H-2*m; cw=ch*ratio; }
        addPage(); pdf.addImage(canvas.toDataURL("image/jpeg",0.88),"JPEG",(W-cw)/2,m,cw,ch);
        // Paper sheets: the scanned paper form images follow, one per page
        for(const a of [...papers.filter(x=>!pdfFiles.includes(x)), ...tbs.filter(x=>!tbPdf.includes(x))]){
          try{ const im=await attImageData(a); if(!im) continue;
            const portrait=im.h>im.w; const PW=portrait?210:297, PH=portrait?297:210;
            let iw=PW-2*m, ih=iw*im.h/im.w; if(ih>PH-2*m){ ih=PH-2*m; iw=ih*im.w/im.h; }
            pdf.addPage("a4", portrait?"portrait":"landscape"); pdf.addImage(im.url,"JPEG",(PW-iw)/2,(PH-ih)/2,iw,ih);
          }catch(e){}
        }
      }
    }
    pdf.setProperties({title:"Activities Work Sheets", creator:"IKM Activities Work Sheet"});
    busy(false);
    const d=new Date(); save(`AWS-full-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.pdf`, pdf.output("blob"), "application/pdf");
    if(skipped) toast(t("exSkipped").replace("{n}",skipped));
  }catch(e){ busy(false); toast(t("dlFail")); }
  finally{ shell.remove(); }
}

  const inFlow = !OPEN_ST.includes(st) || log.length;
  const chain = ["draft","saved"].includes(st) || (st==="returned" && !cur.chain.length) ? routeFor(cur) : cur.chain;
  const stepCls = i => st==="approved" ? "done" : st==="pending" ? (i<cur.step-1?"done":i===cur.step-1?"cur":"wait") : st==="rejected" ? (i<cur.step-1?"done":i===cur.step-1?"rej":"wait") : "wait";

    ? `<ol class="route">${chain.map((id,i)=>`<li class="stepc ${inFlow?stepCls(i):"wait"}"><small>${esc(t("stepN").replace("{n}",i+1))}</small><b>${esc(nameOf(id))}</b></li>`).join("")}</ol>`
    : `<p class="muted" style="margin:0">${esc(st==="submitted"?t("st_submitted"):t("noRoute"))}</p>`;
  const when = s => { const d=new Date(s); return isNaN(d)?"":d.toLocaleString(lang==="th"?"th-TH":"en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
  const hist = log.length ? `<ul class="hist">${[...log].reverse().map(l=>`<li class="h-${esc(l.action)}"><div><b>${esc(t("act_"+l.action))}</b> · ${esc(nameOf(l.actor))}${l.step?` <small>(${esc(t("stepN").replace("{n}",l.step))})</small>`:""}<span class="muted"> · ${esc(when(l.created_at))}</span></div>${l.comment?`<p>${esc(l.comment)}</p>`:""}</li>`).join("")}</ul>` : "";
  const acts = canAct(cur) ? `<div class="ap-box"><label class="lbl" for="ap-c">${esc(t("comment"))}</label>
      <textarea class="inp" id="ap-c" rows="2" placeholder="${esc(t("commentPh"))}"></textarea>
      <div class="ap-btns"><button class="btn okb" id="ap-ok">${esc(t("approve"))}</button><button class="btn warnb" id="ap-ret">${esc(t("returnFix"))}</button><button class="btn rejb" id="ap-rej">${esc(t("reject"))}</button></div></div>` : "";
  const reopen = isAdmin() && !["draft","saved"].includes(st) ? `<button class="btn sm" id="ap-reopen">${esc(t("reopen"))}</button>` : "";
  return `<section class="sec" id="sec-ap"><div class="sec-h"><h2>${esc(t("approval"))}</h2>${locName(sheetLoc(cur))?`<span class="sum">${esc(t("location"))}: <b>${esc(locName(sheetLoc(cur)))}</b></span>`:`<span class="sum">${esc(t("noLocation2"))}</span>`}</div>
    <div class="sec-b ap">${route}${acts}${hist?`<h3 class="h3">${esc(t("history"))}</h3>${hist}`:""}${reopen?`<div>${reopen}</div>`:""}</div></section>`;
}

function wireEdit(){

  [["#dup",dup],["#m-dup",dup],["#del",confirmDelete],["#m-del",confirmDelete],["#dl-x",dlXlsx],["#m-x",dlXlsx],["#dl-p",dlPdf],["#m-p",dlPdf],["#b-draft",()=>commit("draft")],["#b-keep",()=>commit(null)],["#b-saved",()=>commit("saved")],["#b-submit",submitSheet],
    ["#ap-ok",()=>act("approve")],["#ap-ret",()=>act("return")],["#ap-rej",()=>act("reject")],["#ap-reopen",()=>act("reopen")],
    ["#b-goap",()=>{ const s=$("#sec-ap"); if(s){ s.scrollIntoView({block:"start"}); const c=$("#ap-c"); if(c) setTimeout(()=>c.focus(),300); } }]].forEach(([s,f])=>{ const b=$(s); if(b) b.onclick=f; });

    const norm=s=>(s||"").trim().toLowerCase();
    const show=()=>{
      const q=norm(inp.value); const emps=S.masters.employee||[];
      hits = (q ? emps.filter(e=>norm(e.value).includes(q)).sort((x,y)=>norm(x.value).indexOf(q)-norm(y.value).indexOf(q)) : emps).slice(0,8);
      idx=-1;
      if(!hits.length){ box.hidden=true; inp.setAttribute("aria-expanded","false"); return; }
      box.innerHTML=hits.map((e,k)=>`<div class="ac-it" role="option" id="ac-${i}-${k}" data-k="${k}"><b></b><small></small></div>`).join("");
      box.querySelectorAll(".ac-it").forEach((el,k)=>{ el.querySelector("b").textContent=hits[k].value; el.querySelector("small").textContent=hits[k].position||"";
        el.addEventListener("pointerdown",ev=>{ ev.preventDefault(); pick(k); }); });
      box.hidden=false; inp.setAttribute("aria-expanded","true");
    };
    const hide=()=>{ box.hidden=true; inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant"); };
    const mark=()=>{ box.querySelectorAll(".ac-it").forEach((el,k)=>el.classList.toggle("on",k===idx)); if(idx>=0){ inp.setAttribute("aria-activedescendant",`ac-${i}-${idx}`); box.children[idx].scrollIntoView({block:"nearest"}); } };
    const pick=k=>{ const e=hits[k]; if(!e) return; const row=cur.manpower[i];
      inp.value=e.value; row.name=e.value; row.position=e.position||row.position||""; if(pos) pos.value=row.position;
      $("#mp-n").textContent=cur.manpower.filter(x=>x.name).length; hide(); scheduleSave(); if(pos) pos.focus(); };
    inp.addEventListener("input",show);
    inp.addEventListener("focus",show);
    inp.addEventListener("keydown",ev=>{
      if(box.hidden && (ev.key==="ArrowDown")){ show(); return; }
      if(box.hidden) return;
      if(ev.key==="ArrowDown"){ ev.preventDefault(); idx=Math.min(hits.length-1,idx+1); mark(); }
      else if(ev.key==="ArrowUp"){ ev.preventDefault(); idx=Math.max(0,idx-1); mark(); }
      else if(ev.key==="Enter" && idx>=0){ ev.preventDefault(); pick(idx); }
      else if(ev.key==="Escape"){ hide(); }
    });
    inp.addEventListener("blur",()=>{ setTimeout(hide,120);
      // typed a full name without picking: still fill an empty position
      const e=(S.masters.employee||[]).find(x=>norm(x.value)===norm(inp.value)); const row=cur.manpower[i];

  });

    if(k==="jobNo"||k==="project"){ $(".ed-top h1").textContent=cur.jobNo||cur.project||t("untitled"); }
    scheduleSave();
  });
  app.querySelectorAll("[data-k]").forEach(el=>{
    if(el.tagName==="TEXTAREA") autosize(el);
    el.addEventListener("input",()=>{
      setPath(cur, el.dataset.k, el.value);
      if(el.tagName==="TEXTAREA") autosize(el);
      const m=/^manpower\.(\d+)\./.exec(el.dataset.k);
      if(m){ $("#mp-n").textContent=cur.manpower.filter(x=>x.name).length; }
      if(el.dataset.k==="jobNo"||el.dataset.k==="project"){ $(".ed-top h1").textContent=cur.jobNo||cur.project||t("untitled"); }
      scheduleSave();
    });
  });

/* ---------- signature pad ---------- */
function setupPad(k){
  const cv=$("#pad-"+k); if(!cv) return;
  const ctx=cv.getContext("2d");
  const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=2.2; ctx.strokeStyle="#1B2A6B";
  const src=cur.sign[k].sig; if(src){ const img=new Image(); img.onload=()=>{ const s=Math.min(r.width/img.width, r.height/img.height); const w=img.width*s,h=img.height*s; ctx.drawImage(img,(r.width-w)/2,(r.height-h)/2,w,h); }; img.src=src; }
  if(RO) return;
  let drawing=false, last=null;
  const pt=e=>{ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId);
    const h=cv.parentNode.querySelector(".hint"); if(h) h.remove(); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,Math.PI*2); ctx.fillStyle="#1B2A6B"; ctx.fill(); });
  cv.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  const end=()=>{ if(!drawing) return; drawing=false;
    cur.sign[k].sig = exportSig(cv);
    if(!cur.sign[k].date){ cur.sign[k].date=today(); const d=$("#s-"+k+"-d"); if(d) d.value=cur.sign[k].date; }
    const pill=cv.closest(".sig").querySelector("h3 .pill"); pill.className="pill signed"; pill.textContent=t("signedOne");
    scheduleSave(); };
  cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
}
function exportSig(cv){
  const s=Math.min(1, 600/cv.width);
  const o=document.createElement("canvas"); o.width=Math.round(cv.width*s); o.height=Math.round(cv.height*s);
  o.getContext("2d").drawImage(cv,0,0,o.width,o.height);
  return o.toDataURL("image/png");
}

/* ---------- Attachments: Toolbox talk photos and scanned paper AWS (not part of the PDF form) ---------- */
const ATT_BUCKET="aws-toolbox", ATT_MAX=10*1024*1024;
/* New files go to Google Drive through the Apps Script web app when GDRIVE_URL is set; older files stay in Supabase Storage */
const GDRIVE_URL="https://script.google.com/macros/s/AKfycbzZkzexYTnRz6rU8n7HDXYHDPQ3ukKkjoBJwM5VtDlMtHoXN1CZ0lfvA9ObzhaaWEiP/exec".startsWith("https://") ? "https://script.google.com/macros/s/AKfycbzZkzexYTnRz6rU8n7HDXYHDPQ3ukKkjoBJwM5VtDlMtHoXN1CZ0lfvA9ObzhaaWEiP/exec" : "";
const isGd = a => !!a && (a.path||"").includes("/gdrive/");
async function gd(op, body){
  const { data } = await sb.auth.getSession(); const token = data.session ? data.session.access_token : "";
  const r = await fetch(GDRIVE_URL, { method:"POST", body: JSON.stringify(Object.assign({ op, token }, body||{})) });   // text/plain: no CORS preflight
  const j = await r.json().catch(()=>({ error:"HTTP "+r.status }));
  if(j.error) throw new Error(j.error); return j;
}
const b64Of = f => new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]||""); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(f); });
const b64Blob = (b64, type) => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); };
const gdThumbs = {};
async function loadGdThumbs(sheetId){
  const need=(S.atts[sheetId]||[]).filter(a=>isGd(a) && /^image\//.test(a.mime) && !gdThumbs[a.id]).map(a=>a.id);
  if(!need.length || !GDRIVE_URL) return;
  try{ const { thumbs } = await gd("thumbs", { ids:need }); Object.assign(gdThumbs, thumbs||{}); }catch(e){ return; }
  document.querySelectorAll("[data-gdthumb]").forEach(el=>{ const u=gdThumbs[el.dataset.gdthumb]; if(u && !el.querySelector("img")){ el.innerHTML=`<img src="${esc(u)}" alt="">`; } });
}
async function gdOpen(a){
  const w = isMobile() ? null : window.open("about:blank","_blank");
  busy(true);
  try{ const f=await gd("get",{ id:a.id }); const blob=b64Blob(f.b64, f.mime||a.mime); busy(false);
    if(w && !w.closed){ w.location.href=URL.createObjectURL(blob); } else save(a.name, blob, a.mime); }
  catch(e){ busy(false); if(w) w.close(); toast(t("dlFail")+" — "+e.message); }
}
async function removeAtt(a){
  if(isGd(a)){ await gd("del",{ id:a.id }); return; }
  const r1 = await sb.storage.from(ATT_BUCKET).remove([a.path]);
  const r2 = await sb.from("aws_attachments").delete().eq("id", a.id);
  if(r1.error||r2.error) throw new Error((r1.error||r2.error).message||"");
}
const ATT_TYPES=["image/jpeg","image/png","image/webp","image/heic","image/heif","image/gif","application/pdf"];

  const { data, error } = await sb.from("aws_attachments").select("id, kind, path, name, mime, size, uploaded_by, created_at").eq("sheet_id", id).order("created_at");

async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5*1024*1024) return file;
  try{
    const bmp = await createImageBitmap(file); const s=Math.min(1, 2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"}) : file;
  }catch(e){ return file; }
}
// Upload files of one kind; returns how many were stored
async function putFiles(files, kind){
  let ok=0;
  for(const f0 of files){
    const type = f0.type || (/\.pdf$/i.test(f0.name)?"application/pdf":/\.(jpe?g)$/i.test(f0.name)?"image/jpeg":/\.png$/i.test(f0.name)?"image/png":/\.hei[cf]$/i.test(f0.name)?"image/heic":"");
    if(!ATT_TYPES.includes(type)){ toast(t("badType")+": "+f0.name); continue; }
    const f0t = f0.type ? f0 : new File([f0], f0.name, { type });
    const f = await shrinkImage(f0t);
    if(f.size > ATT_MAX){ toast(t("tooBig")+": "+f0.name); continue; }
    if(GDRIVE_URL){
      try{ const b64=await b64Of(f); await gd("upload",{ sheet_id:cur.id, kind, name:f.name, mime:f.type, b64 }); ok++; }
      catch(e){ toast(t("notSaved")+": "+f0.name+" — "+e.message); }
      continue;
    }
    const ext=(f.name.match(/\.(\w{1,5})$/)||[,f.type==="application/pdf"?"pdf":"jpg"])[1].toLowerCase();
    const path=`${cur.id}/${uuid()}.${ext}`;
    const up = await sb.storage.from(ATT_BUCKET).upload(path, f, { contentType:f.type, upsert:false });
    if(up.error){ toast(t("notSaved")+": "+f0.name+" — "+up.error.message); continue; }
    const ins = await sb.from("aws_attachments").insert({ sheet_id:cur.id, kind, path, name:f.name, mime:f.type, size:f.size, uploaded_by:S.me });
    if(ins.error){ await sb.storage.from(ATT_BUCKET).remove([path]); toast(t("notSaved")+": "+f0.name+" — "+ins.error.message); continue; }
    ok++;
  }
  return ok;
}
async function ensureStored(){
  // a brand-new sheet must exist on the server before files can hang off it
  if(isNew){ toast(t("saveFirst")); const b=$("#b-draft"); if(b) b.focus(); return false; }   // files need the sheet stored; edits stay unsaved until a button is pressed

async function uploadAtts(files, kind, saving){
  if(!files.length || RO) return;
  if(saving){ await saving; if(saveState==="err"){ toast(t("notSaved")+(saveErr?" — "+saveErr:"")); return; } }

  busy(true, t("uploading"));

function applyNameFilter(){
  const q=personKey(view.tjob); let n=0;
  document.querySelectorAll(".trk-p tbody tr[data-name]").forEach(tr=>{ const show=!q || tr.dataset.name.includes(q); tr.hidden=!show; if(show){ n++; const c=tr.querySelector(".c-no"); if(c) c.textContent=n; } });
  const nm=document.querySelector(".trk-p .no-match"); if(nm) nm.hidden = n>0 || !document.querySelector(".trk-p tbody tr[data-name]");
  const c=$("#tf-clr"); if(c) c.hidden = !(view.tjob || (view.td1||0)>1 || view.td2);
}

function wireTrack(){
  wirePageTabs();
  const app=$("#app"); const adm=isAdmin();
  const per=TRACK.periods.find(x=>x.id===view.tm);
  const reload=async()=>{ await loadTrack(); if(view.tm) await loadActual(view.tm); renderTrack(); };
  const rf=$("#tr-rf"); if(rf) rf.onclick=async()=>{ await refreshAll(true); await reload(); };
  app.querySelectorAll("[data-y]").forEach(b=>b.onclick=async()=>{ view.ty=+b.dataset.y; view.tm=null; await reload(); });
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=async()=>{ view.trkX=null; view.tm=b.dataset.m; view.td1=0; view.td2=0; await loadActual(view.tm); renderTrack(); });
  app.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));
  // name search: filters rows as you type and suggests names from Admin settings
  const fn=$("#tf-name"), box=$("#tf-ac");
  if(fn){
    let hits=[], idx=-1;
    const hide=()=>{ box.hidden=true; fn.setAttribute("aria-expanded","false"); };
    const show=()=>{ const q=personKey(fn.value); hits=q?(TRACK.people||[]).filter(e=>personKey(e.value).includes(q)).slice(0,8):[]; idx=-1;
      if(!hits.length){ hide(); return; }
      box.innerHTML=hits.map((e,k)=>`<div class="ac-it" role="option" id="tf-ac-${k}"><b></b><small></small></div>`).join("");
      box.querySelectorAll(".ac-it").forEach((el,k)=>{ el.querySelector("b").textContent=hits[k].value; el.querySelector("small").textContent=hits[k].position||"";
        el.addEventListener("pointerdown",ev=>{ ev.preventDefault(); pick(k); }); });
      box.hidden=false; fn.setAttribute("aria-expanded","true"); };
    const pick=k=>{ const e=hits[k]; if(!e) return; fn.value=e.value; view.tjob=e.value; applyNameFilter(); hide(); };
    fn.addEventListener("input",()=>{ view.tjob=fn.value; applyNameFilter(); show(); });
    fn.addEventListener("focus",show);
    fn.addEventListener("blur",()=>setTimeout(hide,120));
    fn.addEventListener("keydown",ev=>{
      if(box.hidden) return;
      if(ev.key==="ArrowDown"){ ev.preventDefault(); idx=Math.min(hits.length-1,idx+1); }
      else if(ev.key==="ArrowUp"){ ev.preventDefault(); idx=Math.max(0,idx-1); }
      else if(ev.key==="Enter"){ ev.preventDefault(); if(idx>=0) pick(idx); else hide(); return; }
      else if(ev.key==="Escape"){ hide(); return; } else return;
      box.querySelectorAll(".ac-it").forEach((el,k)=>el.classList.toggle("on",k===idx)); });
  }
  // the table scrolls inside its own box, so the left–right scrollbar is always on screen; buttons move a week at a time
  const sc=$("#trk-scroll");
  if(sc){
    const step=()=>{ const th=sc.querySelector("thead tr.r-days th"); return (th?th.offsetWidth:80)*7; };
    const l=$("#tr-left"), r=$("#tr-right"), td=$("#tr-today");
    if(l) l.onclick=()=>sc.scrollBy({left:-step(),behavior:"smooth"});
    if(r) r.onclick=()=>sc.scrollBy({left:step(),behavior:"smooth"});
    const goToday=smooth=>{ const c=sc.querySelector("thead tr.r-days th.td"); if(!c) return; const fixed=(sc.querySelector("thead .c-no")?.offsetWidth||0)+(sc.querySelector("thead .c-name")?.offsetWidth||0);
      const x=sc.scrollLeft + c.getBoundingClientRect().left - sc.getBoundingClientRect().left - fixed - 8;
      sc.scrollTo({left:Math.max(0,x), behavior:smooth?"smooth":"auto"}); };
    if(td){ td.hidden=!sc.querySelector("thead tr.r-days th.td"); td.onclick=()=>goToday(true); }
    if(view.trkX!=null) sc.scrollLeft=view.trkX; else goToday(false);
    sc.addEventListener("scroll",()=>{ view.trkX=sc.scrollLeft; },{passive:true});
  }
  const fd1=$("#tf-d1"), fd2=$("#tf-d2");
  if(fd1) fd1.onchange=()=>{ view.td1=+fd1.value; if(+fd2.value<view.td1) view.td2=view.td1; renderTrack(); };
  if(fd2) fd2.onchange=()=>{ view.td2=+fd2.value; if(+fd1.value>view.td2) view.td1=view.td2; renderTrack(); };
  const fc=$("#tf-clr"); if(fc) fc.onclick=()=>{ view.tjob=""; view.td1=0; view.td2=0; renderTrack(); };
  if(!adm) return;
  const L=lang==="th"?"th":"en";
  const monthOpts = sel => MONTHS_L[L].map((m,i)=>`<option value="${i+1}" ${sel===i+1?"selected":""}>${esc(m)}</option>`).join("");
  const dbErr = e => /duplicate|unique/i.test(e.message) ? t("periodDup") : e.message;
  const ay=$("#tr-addy"); if(ay) ay.onclick=()=>formDialog(t("addYear"), `<div class="field"><label for="fd-y">${esc(t("yearCE"))}</label><input class="inp num" id="fd-y" type="number" min="2000" max="2100" value="${(Math.max(0,...TRACK.periods.map(x=>x.year))||new Date().getFullYear()-1)+1}"></div>
      <div class="field"><label for="fd-m">${esc(t("firstMonth"))}</label><select class="inp" id="fd-m">${monthOpts(1)}</select></div>`, async()=>{
      const y=+$("#fd-y").value, m=+$("#fd-m").value; if(!(y>=2000&&y<=2100)) return t("yearCE");
      const { data, error } = await sb.from("aws_track_periods").insert({ year:y, month:m }).select().single(); if(error) return dbErr(error);
      view.ty=y; view.tm=data.id; await reload(); });
  const am=$("#tr-addm"); if(am) am.onclick=()=>{ const used=TRACK.periods.filter(x=>x.year===view.ty).map(x=>x.month); const free=[...Array(12)].map((_,i)=>i+1).filter(m=>!used.includes(m));
    if(!free.length){ toast(t("periodDup")); return; }
    formDialog(t("addMonth")+" "+view.ty, `<div class="field"><label for="fd-m">${esc(t("month"))}</label><select class="inp" id="fd-m">${free.map(m=>`<option value="${m}">${esc(MONTHS_L[L][m-1])}</option>`).join("")}</select></div>
      ${per?`<label class="chk"><input type="checkbox" id="fd-copy"> ${esc(t("copyJobs"))}</label>`:""}`, async()=>{
      const m=+$("#fd-m").value; const { data, error } = await sb.from("aws_track_periods").insert({ year:view.ty, month:m }).select().single(); if(error) return dbErr(error);
      const cp=$("#fd-copy"); if(cp && cp.checked){ const src=TRACK.rows[per.id]||[]; if(src.length) await sb.from("aws_track_rows").insert(src.map((r,i)=>({ period_id:data.id, job_no:r.job_no, plan:{}, sort:i+1 }))); }
      view.tm=data.id; await reload(); }); };
  const ey=$("#tr-edy"); if(ey) ey.onclick=()=>formDialog(t("editYear"), `<div class="field"><label for="fd-y">${esc(t("yearCE"))}</label><input class="inp num" id="fd-y" type="number" min="2000" max="2100" value="${view.ty}"></div>`, async()=>{
      const y=+$("#fd-y").value; if(!(y>=2000&&y<=2100)) return t("yearCE"); if(y===view.ty) return;
      if(TRACK.periods.some(x=>x.year===y)) return t("yearExists");
      for(const p of TRACK.periods.filter(x=>x.year===view.ty)){ const { error } = await sb.from("aws_track_periods").update({ year:y }).eq("id", p.id); if(error) return dbErr(error); }
      view.ty=y; await reload(); });
  const dy=$("#tr-dely"); if(dy) dy.onclick=()=>confirmBox(t("delYearT").replace("{y}",view.ty), t("delYearP"), t("del"), async()=>{
      const { error } = await sb.from("aws_track_periods").delete().eq("year", view.ty); if(error){ toast(error.message); return; } view.ty=null; view.tm=null; await reload(); });
  const em=$("#tr-edm"); if(em) em.onclick=()=>formDialog(t("editMonth"), `<div class="field"><label for="fd-y">${esc(t("yearCE"))}</label><input class="inp num" id="fd-y" type="number" min="2000" max="2100" value="${per.year}"></div>
      <div class="field"><label for="fd-m">${esc(t("month"))}</label><select class="inp" id="fd-m">${monthOpts(per.month)}</select></div>`, async()=>{
      const y=+$("#fd-y").value, m=+$("#fd-m").value; const { error } = await sb.from("aws_track_periods").update({ year:y, month:m }).eq("id", per.id); if(error) return dbErr(error);
      view.ty=y; await reload(); });
  const dm=$("#tr-delm"); if(dm) dm.onclick=()=>confirmBox(t("delMonthT"), t("delMonthP"), t("del"), async()=>{
      const { error } = await sb.from("aws_track_periods").delete().eq("id", per.id); if(error){ toast(error.message); return; } view.tm=null; await reload(); });
  // job rows
  const js=$("#tr-job"), jt=$("#tr-jobtxt");
  if(js) js.onchange=()=>{ jt.hidden = js.value!==OTHER; if(!jt.hidden) jt.focus(); };
  const fr=$("#tr-addrow"); if(fr) fr.onsubmit=async e=>{ e.preventDefault();
    const job = (!js || js.value===OTHER || !js.value) ? jt.value.trim() : js.value; if(!job){ jt.hidden=false; jt.focus(); return; }
    const rows=TRACK.rows[per.id]||[]; if(rows.some(r=>r.job_no.trim().toLowerCase()===job.toLowerCase())){ toast(t("jobInTable")); return; }
    const { error } = await sb.from("aws_track_rows").insert({ period_id:per.id, job_no:job, plan:{}, sort:rows.length+1 }); if(error){ toast(error.message); return; } await reload(); };
  app.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{ const r=(TRACK.rows[per.id]||[]).find(x=>x.id===b.dataset.rdel);
    confirmBox(t("delJobRowT"), r?r.job_no:"", t("del"), async()=>{ const { error } = await sb.from("aws_track_rows").delete().eq("id", r.id); if(error){ toast(error.message); return; } await reload(); }); });
  app.querySelectorAll("[data-redit]").forEach(b=>b.onclick=()=>{ const r=(TRACK.rows[per.id]||[]).find(x=>x.id===b.dataset.redit);
    formDialog(t("editJobRow"), `<div class="field"><label for="fd-j">${esc(t("jobNo"))}</label><input class="inp" id="fd-j" value="${esc(r.job_no)}" list="fd-jl"><datalist id="fd-jl">${(S.masters.job||[]).map(m=>`<option value="${esc(m.value)}">`).join("")}</datalist></div>`, async()=>{
      const v=$("#fd-j").value.trim(); if(!v) return t("jobNo"); const { error } = await sb.from("aws_track_rows").update({ job_no:v }).eq("id", r.id); if(error) return error.message; await reload(); }); });
  // plan cells (multi-person)
  app.querySelectorAll(".pcell").forEach(b=>b.onclick=()=>{
    const r=(TRACK.rows[per.id]||[]).find(x=>x.id===b.dataset.row); const d=+b.dataset.d;
    let sel=planOf(r,d).slice();
    const people=Object.values(S.users).filter(u=>u.active && ((u.roles||[]).includes("user")||(u.roles||[]).includes("admin"))).sort((x,y)=>(x.full_name||x.username).localeCompare(y.full_name||y.username));
    const nd=daysIn(per.year, per.month); const norm=s=>(s||"").trim().toLowerCase();
    const ymd=`${per.year}-${pad2(per.month)}-${pad2(d)}`;
    const filed=u=>(TRACK.actual[per.id]||[]).some(a=>a.created_by===u && a.work_date===ymd && norm(a.job_no)===norm(r.job_no));
    formDialog(`${r.job_no} · ${d} ${MONTHS_L[L][per.month-1]}`, `<div class="field"><label for="fd-q">${esc(t("whoSubmits"))}</label>
        <div class="pchips" id="fd-chips" aria-live="polite"></div>
        <div class="ac"><input class="inp" id="fd-q" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fd-al" placeholder="${esc(t("addPerson"))}"><div class="ac-list" id="fd-al" role="listbox" hidden></div></div></div>
      <div class="field"><span class="lbl">${esc(t("applyTo"))}</span><div class="checks col">
        <label class="chk"><input type="radio" name="fd-sc" value="day" checked> ${esc(t("thisDay"))}</label>
        <label class="chk"><input type="radio" name="fd-sc" value="wd"> ${esc(t("weekdaysRest"))}</label>
        <label class="chk"><input type="radio" name="fd-sc" value="all"> ${esc(t("allRest"))}</label></div></div>`, async()=>{
      const sc=(document.querySelector('input[name="fd-sc"]:checked')||{}).value||"day";
      const plan=Object.assign({}, r.plan);
      for(let x=d; x<=nd; x++){
        if(sc==="day" && x!==d) break;
        const w=new Date(per.year, per.month-1, x).getDay(); if(sc==="wd" && (w===0||w===6)) continue;
        if(sel.length) plan[x]=sel.slice(); else delete plan[x];
      }
      const { error } = await sb.from("aws_track_rows").update({ plan }).eq("id", r.id); if(error) return error.message;
      r.plan=plan; renderTrack(); });
    const inp=$("#fd-q"), box=$("#fd-al"), chips=$("#fd-chips");
    let hits=[], idx=-1;
    const drawChips=()=>{ chips.innerHTML = sel.length ? sel.map(u=>`<span class="pchip ${filed(u)?"done":""}"><span>${esc(nameOf(u))}</span>${filed(u)?`<small>✓ ${esc(t("filedAlready"))}</small>`:""}<button type="button" data-rm="${esc(u)}" aria-label="${esc(t("del"))} ${esc(nameOf(u))}">${I.x}</button></span>`).join("") : `<span class="muted">${esc(t("noPeople"))}</span>`;
      chips.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ sel=sel.filter(u=>u!==x.dataset.rm); drawChips(); inp.focus(); }); };
    const hide=()=>{ box.hidden=true; inp.setAttribute("aria-expanded","false"); inp.removeAttribute("aria-activedescendant"); };
    const show=()=>{ const q=norm(inp.value);
      const nm=u=>u.full_name||u.username;
      hits=people.filter(u=>!sel.includes(u.id) && (!q || norm(nm(u)).includes(q) || norm(u.username).includes(q))).slice(0,8); idx=hits.length&&q?0:-1;
      if(!hits.length){ hide(); return; }
      box.innerHTML=hits.map((u,k)=>`<div class="ac-it ${k===idx?"on":""}" role="option" id="fd-al-${k}"><b></b><small></small></div>`).join("");
      box.querySelectorAll(".ac-it").forEach((el,k)=>{ el.querySelector("b").textContent=nm(hits[k]); el.querySelector("small").textContent=hits[k].username;
        el.addEventListener("pointerdown",ev=>{ ev.preventDefault(); pick(k); }); });
      box.hidden=false; inp.setAttribute("aria-expanded","true"); };
    const mark=()=>{ box.querySelectorAll(".ac-it").forEach((el,k)=>el.classList.toggle("on",k===idx)); if(idx>=0){ inp.setAttribute("aria-activedescendant","fd-al-"+idx); box.children[idx].scrollIntoView({block:"nearest"}); } };
    const pick=k=>{ const u=hits[k]; if(!u) return; sel.push(u.id); inp.value=""; drawChips(); hide(); inp.focus(); };
    inp.addEventListener("input",show); inp.addEventListener("click",show);
    inp.addEventListener("blur",()=>setTimeout(hide,120));
    inp.addEventListener("keydown",ev=>{
      if(ev.key==="Enter"){ if(!box.hidden && idx>=0){ ev.preventDefault(); pick(idx); return; } if(inp.value.trim()){ ev.preventDefault(); return; } return; }
      if(ev.key==="Backspace" && !inp.value && sel.length){ sel.pop(); drawChips(); return; }
      if(box.hidden){ if(ev.key==="ArrowDown") show(); return; }
      if(ev.key==="ArrowDown"){ ev.preventDefault(); idx=Math.min(hits.length-1,idx+1); mark(); }
      else if(ev.key==="ArrowUp"){ ev.preventDefault(); idx=Math.max(0,idx-1); mark(); }
      else if(ev.key==="Escape"){ ev.stopPropagation(); hide(); }
    });
    drawChips();
  });
}
function formDialog(title, fields, onSave){
  const slot=$("#ov-slot");
  slot.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="fd-t"><form class="dlg" id="fd" novalidate><h2 id="fd-t">${esc(title)}</h2>${fields}
    <div class="err" id="fd-err" role="alert"></div>
    <div class="acts"><button type="button" class="btn" id="fd-c">${esc(t("cancel"))}</button><button type="submit" class="btn pri" id="fd-s">${esc(t("save"))}</button></div></form></div>`;
  $("#fd-c").onclick=()=>slot.innerHTML="";
  const first=slot.querySelector("input,select"); if(first) first.focus();
  $("#fd").onsubmit=async e=>{ e.preventDefault(); const go=$("#fd-s"); go.disabled=true;
    const err = await onSave(); if(err){ $("#fd-err").textContent=err; go.disabled=false; return; } slot.innerHTML=""; };
}

/* ---------- overlay / toast ---------- */
function confirmBox(title, text, okLabel, onOk, plain){
  const okCls = plain==="info" ? "btn info" : "btn pri";
  const slot=$("#ov-slot");
  slot.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dlg"><h2 id="dt">${esc(title)}</h2><p>${esc(text)}</p>
    <div class="acts"><button class="btn" id="dc">${esc(t("cancel"))}</button><button class="${okCls}" id="dk">${plain?"":I.trash}${esc(okLabel)}</button></div></div></div>`;
  $("#dc").onclick=()=>slot.innerHTML=""; $("#dc").focus();
  $("#dk").onclick=()=>{ slot.innerHTML=""; onOk(); };
}
function confirmDelete(){
  confirmBox(t("delT"), t("delP"), t("del"), async()=>{
    const id=cur.id; clearTimeout(saveTimer); dirty=false;
    const all=S.atts[id]||[]; const paths=all.filter(x=>!isGd(x)).map(x=>x.path); if(paths.length) await sb.storage.from(ATT_BUCKET).remove(paths);
    for(const a of all.filter(isGd)){ try{ await gd("del",{ id:a.id }); }catch(e){} }
    const { error } = await sb.from("aws_worksheets").delete().eq("id", id);
    if(error){ toast(t("notSaved")+" "+error.message); return; }
    S.list=S.list.filter(x=>x.id!==id); view.name="list"; cur=null; toast(t("deleted")); render();
  });
}
let toastT; function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3000); }

function fileBase(w){ return ("AWS_"+(w.jobNo||"nojob")+"_"+(w.date||"")).replace(/[^\w\-.]+/g,"_"); }

  return `<div class="pf">
