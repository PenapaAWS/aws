  <div class="pf-grid">
    <table><colgroup><col style="width:8%"><col style="width:38%"><col style="width:26%"><col style="width:14%"><col style="width:14%"></colgroup>
      <thead><tr><th class="cap" colspan="5">Manpower</th></tr><tr><th>No</th><th>Employee</th><th>Position</th><th>Start</th><th>Finish</th></tr></thead><tbody>${mp.join("")}</tbody></table>
    <table><colgroup><col style="width:76%"><col style="width:24%"></colgroup>
      <thead><tr><th class="cap" colspan="2">Equipment</th></tr><tr><th>Type</th><th>Q'ty</th></tr></thead><tbody>${eq.join("")}</tbody></table>
    <table><colgroup><col style="width:20%"><col style="width:80%"></colgroup>
      <thead><tr><th class="cap" colspan="2">Work description</th></tr><tr><th>Time</th><th>Activity</th></tr></thead><tbody>${wk.join("")}</tbody></table>
  </div>
  <div class="pf-sign">${sg("ikm","IKM Representative")}${sg("client1","Client Representative")}${sg("client2","Client Representative")}</div>
  <div class="pf-foot"><span>Location: Operation Folder</span><span>1/1</span><span>TH-OPS-FRM-071 Rev 1</span></div>
  </div>`;
}

/* ---------- downloads ---------- */
const isMobile = () => (window.matchMedia && matchMedia("(pointer:coarse)").matches) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function save(filename, data, type){
  const blob = data instanceof Blob ? (type ? new Blob([data],{type}) : data) : new Blob([data], {type});
  const url=URL.createObjectURL(blob);
  if(!isMobile()){
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000); return;
  }
  // Phones: the file is offered in a dialog so the tap that saves it is a fresh tap
  // (share sheets and downloads are refused when they start long after the original tap).
  let file=null; try{ file=new File([blob], filename, {type:blob.type}); }catch(e){}
  const canShare = !!(file && navigator.canShare && navigator.canShare({files:[file]}));
  const slot=$("#ov-slot");
  slot.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="rd-t"><div class="dlg"><h2 id="rd-t">${esc(t("readyT"))}</h2><p>${esc(t("readyP"))}<br><b class="rd-n"></b></p>
    <div class="ready">${canShare?`<button class="btn pri" id="rd-s">${esc(t("share"))}</button>`:""}
      <a class="btn ${canShare?"":"pri"}" id="rd-o" href="${url}" download="${esc(filename)}" target="_blank" rel="noopener">${esc(t("openFile"))}</a>
      <button class="btn ghost" id="rd-c">${esc(t("cancel"))}</button></div>
    <p class="muted" style="font-size:12.5px;margin:12px 0 0">${esc(t("lineTip"))}</p></div></div>`;
  slot.querySelector(".rd-n").textContent=filename;
  const close=()=>{ slot.innerHTML=""; setTimeout(()=>URL.revokeObjectURL(url), 60000); };
  $("#rd-c").onclick=close;
  $("#rd-o").addEventListener("click",()=>setTimeout(close,400));
  const sb2=$("#rd-s"); if(sb2) sb2.onclick=async()=>{ try{ await navigator.share({files:[file], title:filename}); close(); }catch(e){ if(e && e.name!=="AbortError") toast(t("dlFail")); } };
}
function busy(on, msg){ let el=$(".busy-ov"); if(on){ if(!el){ el=document.createElement("div"); el.className="busy-ov"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg||t("makingPdf"); } else if(el) el.remove(); }
function loadScript(src, globalName){ return new Promise((res,rej)=>{ if(window[globalName]) return res(window[globalName]);
  const s=document.createElement("script"); s.src=src; s.onload=()=>res(window[globalName]); s.onerror=rej; document.head.appendChild(s); }); }
async function dlPdf(){
  busy(true);
  let h2c, jsPDF;
  try{
    h2c = await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js","html2canvas");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","jspdf");
    jsPDF = window.jspdf.jsPDF;
  }catch(e){ busy(false); toast(t("dlFail")); return; }
  // Fixed-size stage wider than any phone screen so the A4 layout is never clipped.
  const shell=document.createElement("div");
  shell.style.cssText="position:fixed;left:0;top:0;width:1200px;height:2400px;overflow:hidden;pointer-events:none;z-index:-1";
  const host=document.createElement("div");
  host.className="pdfsrc"; host.style.cssText="position:absolute;left:0;top:0;width:1123px;background:#fff;padding:18px 22px;color:#111";
  host.innerHTML=`<style>${PF_CSS(".pdfsrc ")}</style>${formHTML(cur)}`;
  shell.appendChild(host); document.body.appendChild(shell);
  try{
    try{ await document.fonts.ready; }catch(e){}
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    const scale = isMobile() ? 1.6 : 2;
    const canvas = await h2c(host,{scale,backgroundColor:"#ffffff",logging:false,scrollX:0,scrollY:0,windowWidth:1200,windowHeight:Math.max(1200,host.scrollHeight+40),width:host.offsetWidth,height:host.offsetHeight});
    const pdf = new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
    const W=297,H=210,m=7; const ratio=canvas.width/canvas.height;
    let w=W-2*m, h=w/ratio; if(h>H-2*m){ h=H-2*m; w=h*ratio; }
    pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",(W-w)/2,m,w,h);
    pdf.setProperties({title:"Activities Work Sheet "+(cur.jobNo||"")+" "+(cur.date||""), creator:"IKM Activities Work Sheet"});
    busy(false);
    save(fileBase(cur)+".pdf", pdf.output("blob"), "application/pdf");
  }catch(e){ busy(false); toast(t("dlFail")); }
  finally{ shell.remove(); }
}
async function dlXlsx(){
  let X; try{ X=await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","XLSX"); }catch(e){ toast(t("dlFail")); return; }
  const w=cur; const n=Math.max(20,w.manpower.length,w.equipment.length,w.work.length);
  const A=[]; const row=()=>Array(12).fill(""); let r;
  r=row(); r[10]="Date :"; r[11]=fmtPaper(w.date); A.push(r);
  r=row(); r[1]="IKM TESTING (THAILAND) CO.,LTD."; r[10]="Client Name :"; r[11]=w.client; A.push(r);
  r=row(); r[4]="ACTIVITIES WORK SHEET"; r[10]="Job No. :"; r[11]=w.jobNo; A.push(r);
  r=row(); r[10]="Project Name :"; r[11]=w.project; A.push(r);
  A.push(row());
  r=row(); r[0]="Manpower"; r[6]="Equipment"; r[10]="Work description"; A.push(r);
  r=row(); r[0]="No"; r[1]="Employee"; r[2]="Position"; r[3]="Start"; r[4]="Finish"; r[6]="Type"; r[8]="Q'ty"; r[10]="Time"; r[11]="Activity"; A.push(r);
  for(let i=0;i<n;i++){ const m=w.manpower[i]||{}, e=w.equipment[i]||{}, k=w.work[i]||{}; r=row();
    if(m.name||m.position){ r[0]=i+1; r[1]=m.name||""; r[2]=m.position||""; r[3]=m.start||""; r[4]=m.finish||""; }
    r[6]=e.type||""; r[8]= e.qty!==""&&e.qty!=null&&!isNaN(+e.qty) ? +e.qty : (e.qty||"");
    r[10]=k.time||""; r[11]=k.activity||""; A.push(r); }
  A.push(row());
  const s=w.sign; const sgn=x=>x&&x.sig?"(signed electronically)":"";
  r=row(); r[0]="IKM Representative"; r[6]="Client Representative"; r[10]="Client Representative"; A.push(r);
  [["Signature :",sgn],["Print name :",x=>x.name||""],["Position :",x=>x.position||""],["Date :",x=>fmtPaper(x.date)]].forEach(([l,f])=>{
    r=row(); r[0]=l; r[1]=f(s.ikm||{}); r[6]=l; r[7]=f(s.client1||{}); r[10]=l; r[11]=f(s.client2||{}); A.push(r); });
  A.push(row()); r=row(); r[0]="Location: Operation Folder"; r[11]="TH-OPS-FRM-071 Rev 1"; A.push(r);
  const ws=X.utils.aoa_to_sheet(A);
  ws["!cols"]=[5,24,16,8,8,2,22,6,6,2,12,48].map(w=>({wch:w}));
  const M=(r1,c1,r2,c2)=>({s:{r:r1,c:c1},e:{r:r2,c:c2}});
  ws["!merges"]=[M(1,1,2,3),M(2,4,2,8),M(5,0,5,4),M(5,6,5,8),M(5,10,5,11),M(6,6,6,7)];
  for(let i=0;i<n;i++) ws["!merges"].push(M(7+i,6,7+i,7));
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "FORM");
  save(fileBase(w)+".xlsx", X.write(wb,{bookType:"xlsx",type:"array"}), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
}

/* ---------- language + boot ---------- */
function setLang(l){ lang=l; try{ localStorage.setItem("ikm-aws-lang",l); }catch(e){} const err=$(".err"); render(); }
$("#lang-en").onclick=()=>setLang("en"); $("#lang-th").onclick=()=>setLang("th");
window.addEventListener("beforeunload",e=>{ if(dirty && !RO){ e.preventDefault(); e.returnValue=""; } });
// leaving the sheet with unsaved changes asks: Save / Don't save / Cancel
function guardLeave(go){
  if(!(cur && dirty && !RO)){ go(); return; }
  const slot=$("#ov-slot");
  slot.innerHTML=`<div class="ov" role="dialog" aria-modal="true" aria-labelledby="lv-t"><div class="dlg"><h2 id="lv-t">${esc(t("leaveT"))}</h2><p>${esc(t("leaveP"))}</p>
    <div class="acts"><button class="btn" id="lv-c">${esc(t("cancel"))}</button><button class="btn ghost danger" id="lv-n">${esc(t("leaveNo"))}</button><button class="btn bdraft" id="lv-y">${esc(t("leaveYes"))}</button></div></div></div>`;
  $("#lv-c").onclick=()=>slot.innerHTML="";
  $("#lv-n").onclick=()=>{ slot.innerHTML=""; dirty=false; saveState="saved"; go(); };
  $("#lv-y").onclick=async()=>{ slot.innerHTML=""; await flush(); if(saveState==="err"){ toast(t("notSaved")+(saveErr?" — "+saveErr:"")); return; } toast(t("keptDone")); go(); };
  $("#lv-y").focus();
}

async function boot(){
  render();
  try{
    if(await loadProfile()){ await refreshAll(true); S.phase="app"; render(); await restoreStash(); return; }
    if(S.me){ await sb.auth.signOut(); }
    const { data, error } = await sb.rpc("aws_needs_setup");
    S.phase = (!error && data===true) ? "setup" : "login"; render();
  }catch(e){ S.phase="login"; render(); }
}
boot();
})();
